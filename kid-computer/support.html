<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kid Computer is now DiscoveryDesk</title>
  <meta http-equiv="refresh" content="3; url=../discoverydesk/support.html">
  <link rel="canonical" href="https://fitz1567.github.io/mac-apps/discoverydesk/support.html">
  <meta name="description" content="Kid Computer is now called DiscoveryDesk. Its support page has moved.">
  <style>
:root { --bg:#f6f7f9; --surface:#fff; --stroke:#e1e4ea; --text:#1b1f2a; --text-2:#545b6b; --accent:#6a4bd6; --soft:color-mix(in srgb, var(--accent) 10%, var(--surface)); color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root { --bg:#0f1218; --surface:#191d26; --stroke:#323949; --text:#f2f5fa; --text-2:#a5afc4; --accent:#b49cff; } }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin:0; background:var(--bg); color:var(--text); font:17px/1.65 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
main { max-width:720px; margin:0 auto; padding:48px 20px 64px; }
header { margin-bottom:32px; }
.brand { display:flex; align-items:center; gap:14px; margin-bottom:18px; text-decoration:none; color:inherit; }
.brand img { width:56px; height:56px; }
.brand span { font-weight:700; font-size:20px; }
h1 { font-size:clamp(30px, 6vw, 40px); line-height:1.15; margin:0 0 8px; }
.meta { color:var(--text-2); margin:0; }
.summary { background:var(--soft); border:1px solid var(--stroke); border-radius:18px; padding:20px 22px; margin:0 0 36px; }
.summary strong { display:block; font-size:19px; margin-bottom:4px; }
.summary p { margin:0; }
h2 { font-size:22px; line-height:1.3; margin:40px 0 10px; }
h3 { font-size:18px; margin:26px 0 6px; }
ul { padding-left:22px; margin:10px 0; }
li { margin:6px 0; }
a { color:var(--accent); text-underline-offset:3px; }
nav { display:flex; gap:18px; flex-wrap:wrap; margin-top:14px; }
details { background:var(--surface); border:1px solid var(--stroke); border-radius:14px; padding:12px 16px; margin:10px 0; }
summary { cursor:pointer; font-weight:600; }
details p { margin:10px 0 2px; }
.apps { display:grid; gap:14px; }
.app { display:flex; gap:16px; align-items:center; background:var(--surface); border:1px solid var(--stroke); border-radius:18px; padding:16px; }
.app img { width:64px; height:64px; flex:none; }
.app p { margin:2px 0 0; color:var(--text-2); }
footer { margin-top:56px; padding-top:20px; border-top:1px solid var(--stroke); color:var(--text-2); font-size:15px; }</style>
</head>
<body>
  <main>
    <header>
      <a class="brand" href="../discoverydesk/support.html"><img src="icon.png" alt=""><span>DiscoveryDesk</span></a>
      <h1>Kid Computer is now called DiscoveryDesk</h1>
      <p class="meta">Same app, new name.</p>
    </header>
    <div class="summary"><strong>This page has moved.</strong><p>See the <a href="../discoverydesk/support.html">DiscoveryDesk Support</a>.</p></div>
    <footer>© 2026 Kevin Fitzgerald. Mac, macOS, iPhone, iPad and App Store are trademarks of Apple Inc., used here for identification only.</footer>
  </main>
</body>
</html>
